{{ define "main" }}
<article class="article shell"><div class="article-header"><a class="back-link" href="/posts/">← All writing</a><div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 January 2006" }}</time><span aria-hidden="true">·</span><span>{{ .ReadingTime }} min read</span></div><h1>{{ .Title }}</h1>{{ with .Description }}<p class="article-deck">{{ . }}</p>{{ end }}<div class="tag-row">{{ range .Params.tags }}<a class="tag" href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}</div></div><div class="article-body prose">{{ .Content }}</div><div class="article-end"><a href="/posts/">← Back to writing</a></div></article>
{{ end }}
